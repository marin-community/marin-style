name: Ops - Stale

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview without changing issues or PRs
        type: boolean
        default: true

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: ops-stale
  cancel-in-progress: false

jobs:
  stale:
    if: github.repository_owner == 'marin-community'
    uses: ./.github/workflows/reusable-stale.yaml
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
